name: cek-harga

on:
  workflow_dispatch:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ccxt requests
      - name: Cek harga BTC
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          import ccxt
          import requests

          lines = ["CEK HARGA BTC (live, dari server bot)", ""]
          targets = [
              ("bybit", "BTC/USDT", "spot"),
              ("bybit", "BTC/USDT:USDT", "perp"),
              ("kucoin", "BTC/USDT", "spot"),
              ("okx", "BTC/USDT", "spot"),
          ]
          for name, sym, kind in targets:
              try:
                  opts = {"enableRateLimit": True}
                  if kind == "perp":
                      opts["options"] = {"defaultType": "swap"}
                  ex = getattr(ccxt, name)(opts)
                  t = ex.fetch_ticker(sym)
                  ts = t.get("timestamp")
                  waktu = (
                      datetime.fromtimestamp(ts / 1000, timezone.utc).strftime("%H:%M:%S")
                      if ts
                      else "?"
                  )
                  lines.append(f"{name} {kind}: {t['last']:,.2f} (data {waktu} UTC)")
              except Exception as e:
                  lines.append(f"{name} {kind}: GAGAL ({str(e)[:90]})")
          now = datetime.now(timezone.utc).strftime("%H:%M:%S")
          lines += ["", f"Waktu cek: {now} UTC", "Bandingkan dengan TradingView sekarang."]
          url = "https://api.telegram.org/bot" + os.environ["TELEGRAM_TOKEN"] + "/sendMessage"
          requests.post(
              url,
              data={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": "\n".join(lines)},
              timeout=30,
          ).raise_for_status()
          PY
